# knishio-cli CI — clippy + test gate + dependency-advisory audit.
# House Rust style (mirrors the SDK repos): pinned action refs (SHA-pinned as of
# 2026-08 — the header claimed this before the refs actually were),
# dtolnay/rust-toolchain stable, exit-code gates, no floating tags.
# Cargo.lock is COMMITTED (0.2.0): the test job builds --locked for
# reproducibility (a fresh resolve broke the first testnet CD — newest
# pgvector pulled sqlx 0.9 beside our 0.8; F-12). The audit job still
# resolves FRESH (cargo update) so RUSTSEC coverage tracks what a new
# consumer would get — notably libcrux-ml-kem >= 0.0.9 via knishio-client.
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false (2026-08) — nothing here pushes; a kept token is readable from .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      # Lint gate: clippy warn-level (matches the crate's #![warn(clippy::all)]);
      # NOT -D warnings.
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --locked

  audit:
    name: cargo audit (dependency advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      # Cargo.lock is committed, but the audit should track what a FRESH
      # resolve pulls (newer transitive deps a consumer would get), so update
      # to latest-compatible before auditing.
      - name: Refresh lockfile to latest-compatible
        run: cargo update

      - name: Install cargo-audit
        uses: taiki-e/install-action@b9b2dbfff0f381c9fe5e52c55f95c5d0486949d9  # cargo-audit

      - name: cargo audit
        run: cargo audit
