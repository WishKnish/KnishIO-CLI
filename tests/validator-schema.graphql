type SubscriptionRoot {
	"""
	Subscribe to DAG structure changes for real-time visualization.
	
	Emits events when molecules are accepted into the DAG and when bonds
	(parent-child edges) are created. Designed for the DAG Explorer UI.
	
	Events are emitted directly from application code after bond creation
	via an in-process broadcast channel, so this works in every deployment.
	
	# Arguments
	* `cell_slug` - Optional cell slug to filter events. If not provided, receives all events.
	
	# Example
	```graphql
	subscription {
	dagChanges(cellSlug: "my_app") {
	eventType
	molecularHash
	status
	height
	cumulativeWeight
	parentHashes
	bondHash
	}
	}
	```
	"""
	dagChanges(cellSlug: String): DagChange!
	"""
	Subscribe to molecule-status changes for a wallet bundle (WP-016).
	
	Emits when a molecule submitted by `bundle` is accepted, carrying the full
	molecule (atoms + metas) per the SDK's `onCreateMolecule($bundle)`
	selection. Powered by the same in-process broadcast pattern as
	`dagChanges` — no external CDC, works in every deployment.
	
	# Example
	```graphql
	subscription onCreateMolecule($bundle: String!) {
	CreateMolecule(bundle: $bundle) { molecularHash status atoms { isotope } }
	}
	```
	"""
	CreateMolecule(bundle: String!): CreateMolecule!
	"""
	Subscribe to balance changes for a `(bundle, token)` wallet (WP-016 Slice 2).
	
	Emits whenever a molecule changes that wallet's balance (debit, credit,
	remainder, mint, buffer, fusion), carrying the post-commit summed balance.
	Same in-process broadcast pattern as `dagChanges`/`CreateMolecule`.
	
	# Example
	```graphql
	subscription onWalletStatus($bundle: String!, $token: String!) {
	WalletStatus(bundle: $bundle, token: $token) { bundle token admission balance }
	}
	```
	"""
	WalletStatus(bundle: String!, token: String!): WalletStatus!
	"""
	Subscribe to session-presence changes for a `(metaType, metaId)` user
	(WP-016 Slice 4).
	
	Emits whenever an `ActiveSession` mutation upserts a session for that
	`(metaType, metaId)`. Same in-process broadcast pattern as
	`dagChanges`/`WalletStatus`. P-isotope peer heartbeats do not emit here.
	
	# Example
	```graphql
	subscription onActiveUser($metaType: String!, $metaId: String!) {
	ActiveUser(metaType: $metaType, metaId: $metaId) {
	bundleHash metaType metaId jsonData createdAt updatedAt
	}
	}
	```
	"""
	ActiveUser(metaType: String!, metaId: String!): ActiveUser!
	"""
	Subscribe to wallet changes for a `bundle` (WP-016 Slice 3 — closes WP-016).
	
	Emits the spendable wallet record for each `(bundle, token)` a molecule
	changes. Same in-process broadcast pattern as `dagChanges`/`WalletStatus`;
	the SDK's nested `walletBundle`/`token`/`metas` resolve lazily via ctx.
	
	# Example
	```graphql
	subscription onActiveWallet($bundle: String!) {
	ActiveWallet(bundle: $bundle) {
	address bundleHash tokenSlug position amount
	walletBundle { bundleHash slug createdAt }
	token { slug name fungibility supply decimals amount icon createdAt }
	metas { molecularHash position metaType metaId key value createdAt }
	}
	}
	```
	"""
	ActiveWallet(bundle: String!): Wallet!
	"""
	Subscribe to embedding progress events for DataBraid observability.
	
	Emits events when meta rows are embedded, allowing apps to update
	spinner badges to completion indicators in real time.
	
	Events are emitted directly from the embedding pipeline via an in-process
	broadcast channel, so this works in every deployment.
	
	# Arguments
	* `meta_type` - Optional filter by metadata type
	* `meta_id` - Optional filter by instance identifier
	
	# Example
	```graphql
	subscription {
	embeddingChanges(metaType: "product", metaId: "SKU-001") {
	metaType
	metaId
	key
	state
	model
	embeddedAt
	molecularHash
	}
	}
	```
	"""
	embeddingChanges(metaType: String, metaId: String): EmbeddingChange!
}

