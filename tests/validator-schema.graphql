"""
Atom: Atomic operation within a molecule

An atom represents a single, indivisible operation in the ledger.
Atoms are the smallest unit of transaction processing.
"""
type Atom {
	"""
	Unique identifier
	"""
	id: ID!
	"""
	Molecular hash (parent molecule)
	"""
	molecularHash: String!
	"""
	Position in bundle sequence
	"""
	position: String!
	"""
	Wallet address (target of this operation)
	"""
	walletAddress: String!
	"""
	Isotope type (V=value, C=create, M=metadata, I=identity, U=auth)
	"""
	isotope: String!
	"""
	Token slug
	"""
	token: String!
	"""
	Value (amount or data depending on isotope)
	"""
	value: String
	"""
	Metadata type
	"""
	metaType: String
	"""
	Metadata ID
	"""
	metaId: String
	"""
	NFT batch ID
	"""
	batchId: String
	"""
	Index within molecule (nullable for legacy atoms)
	"""
	index: Int
	"""
	One-time signature fragment
	"""
	otsFragment: String
	"""
	Public key
	"""
	pubkey: String
	"""
	Atom metadata as JSON string (for SDK compatibility with PHP's metasJson field)
	"""
	metasJson: String
	"""
	Creation timestamp
	"""
	createdAt: DateTime!
	"""
	Token slug alias for PHP schema compatibility
	PHP server exposes `tokenSlug` while Rust uses `token`
	"""
	tokenSlug: String!
	"""
	F-2 (E2E gauntlet 2026-06-02): structured per-atom metadata matching the JS
	SDK's `Molecule { atoms { metas { … } } }` selection (the SDK selects a nested
	`metas` object; previously only `metasJson` — a raw JSON string — was exposed,
	so the query errored "Unknown field metas on type Atom").
	
	Built **in-memory** from `metas_json` (the atom's `meta` JSONB = a
	`[{ "key", "value" }]` array, i.e. `Vec<crate::models::atom::MetaItem>`) plus
	the atom's own fields — no DB query / no N+1 (mirrors the CreateMolecule
	subscription's build-from-in-memory approach, WP-016). Reuses
	`CreateMoleculeMeta` (the exact 7-field shape the SDK selects).
	"""
	metas: [CreateMoleculeMeta!]!
}

"""
