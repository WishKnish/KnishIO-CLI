"""
Per-instance embedding state for DataBraid observability.

Derived from existing `metas` columns at query time — no extra DB columns needed.
Apps use this to render spinner badges (PENDING), green badges (COMPLETE),
or refresh indicators (STALE) on meta assets.
"""
enum EmbeddingState {
	"""
	No embeddings yet (embedding IS NULL on all rows)
	"""
	PENDING
	"""
	Embeddings exist but model differs from current config (needs re-embedding)
	"""
	STALE
	"""
	All rows have current-model embeddings
	"""
	COMPLETE
}

