	"""
	The wallet bundle (user identity) this wallet belongs to.
	WP-016 Slice 3: the SDK's ActiveWallet selection includes
	`walletBundle { bundleHash, slug, createdAt }`. Resolved lazily from the
	`wallet_bundles` row for this wallet's bundle_hash.
	"""
	walletBundle: WalletBundle
	"""
	Metadata associated with this wallet (WP-016 Slice 3 — ActiveWallet `metas`).
	Wallet metas are keyed by `metas.meta_id = wallet.address` (per the PHP
	server, authoritative); `position` comes from the `atoms` table (the
	`metas` table has no position column), correlated by molecular_hash +
	meta_id so each meta yields a single position. Shadow wallets (address
	NULL) have no metas.
	"""
	metas: [WalletMeta!]!
}

type WalletBundle {
	id: ID!
	bundleHash: String!
	"""
	Human-readable bundle slug (SDK ActiveWallet `walletBundle.slug`).
	TRACKED-INCOMPLETE: `wallet_bundles` has no `slug` column — no validator
	source today (like `admission` / `tokenUnits`). Exposed as nullable so the
	SDK's `walletBundle { slug }` selection resolves; returns None until a
	slug source is defined.
	"""
	slug: String
	createdAt: DateTime!
	updatedAt: DateTime!
	lastActivityAt: DateTime
	"""
	Get all wallets in this bundle using DataLoader
	"""
	wallets: [Wallet!]!
	"""
	Get wallets for a specific token
	"""
	walletsForToken(tokenSlug: String!): [Wallet!]!
	"""
	Count of unique tokens in this bundle
	"""
	tokenCount: Int!
	"""
	Check if bundle has been active recently (within last 30 days)
	"""
	isActive: Boolean!
	"""
	Get metadata associated with this wallet bundle.
	SDK selects: molecularHash, position, key, value, createdAt.
	`position` is NOT a column on `metas` — it comes from the `atoms` table
	(correlated by molecular_hash + meta_id, mirroring `Wallet.metas`). A prior
	`SELECT position FROM metas` errored at runtime (no such column).
	"""
	metas: [MetaItemSDK!]!
}

"""
Metadata item attached to a wallet (WP-016 Slice 3 — ActiveWallet `metas`).
Matches the SDK selection `{ molecularHash, position, metaType, metaId, key,
value, createdAt }`. A dedicated type because `MetaItemSDK` lacks
metaType/metaId and `Meta` lacks position — neither is a faithful shape.
"""
type WalletMeta {
	molecularHash: String
	position: String
	metaType: String
	metaId: String
	key: String!
	value: String!
	createdAt: DateTime!
}

"""
GraphQL type for the `WalletStatus` subscription (WP-016 Slice 2). Matches the
SDK `onWalletStatus($bundle, $token)` selection: `{ bundle, token, admission,
balance }`. `admission` is currently always `None` (no validator source yet).
"""
type WalletStatus {
	bundle: String!
	token: String!
	admission: String
	balance: String!
}

"""
Marks an element of a GraphQL schema as no longer supported.
"""
directive @deprecated(reason: String = "No longer supported") on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE
"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: Mutation
	subscription: SubscriptionRoot
}
