	{ metaType: "product", metaId: "SKU-001" },
	{ metaType: "product", metaId: "SKU-002" },
	{ metaType: "profile", metaId: "user_42" }
	]) {
	metaType metaId state totalMetas embeddedCount embeddedAt model
	}
	}
	```
	"""
	embeddingStatus(
		"""
		Metadata type (single-instance mode)
		"""
		metaType: String,
		"""
		Instance identifier (single-instance mode)
		"""
		metaId: String,
		"""
		Array of (metaType, metaId) pairs (bulk mode)
		"""
		instances: [EmbeddingStatusInput!]
	): [EmbeddingStatusItem!]!
	"""
	Semantic search across metadata using vector embeddings (GAP-06-002)
	
	Requires pgvector extension and pre-computed embeddings in the metas table.
	The caller is responsible for generating the query embedding (text → vector).
